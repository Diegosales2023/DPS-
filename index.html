    <script>
      // Gracefully handle environments/polyfills that try to assign to window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(newFetch) {
              originalFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('[Fetch Patch] Could not define custom fetch setter:', e);
        }
      })();
    </script>
